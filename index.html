<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>9 Ave de la République - RDC</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css"/>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #000; }
        #panorama { width: 100%; height: 100%; }
        
        #loader-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #1a1a1a; color: white; display: flex; 
            flex-direction: column; align-items: center; justify-content: center; 
            z-index: 2000; transition: opacity 0.8s ease;
        }
    </style>
</head>
<body>

<div id="loader-overlay">
    <h1>Pellevoisin 9 avenue de la République - RDC</h1>
    <p>Chargement des photos...</p>
</div>

<div id="panorama"></div>

<script src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>
<script>
const viewer = pannellum.viewer('panorama', {
    "default": {
        "firstScene": "entree",
        "author": "Visite Virtuelle",
        "autoLoad": true,
        "sceneFadeDuration": 1000
    },

    "scenes": {
        "entree": {
            "title": "Entrée",
            "panorama": "entree_cuisine_20042.JPG", 
            "hotSpots": [
                { "pitch": -5, "yaw": 45, "type": "scene", "text": "Séjour (Gauche)", "sceneId": "sejour" },
                { "pitch": -5, "yaw": -45, "type": "scene", "text": "Chambre 1 (Droite)", "sceneId": "chambre1" }
            ]
        },
        "sejour": {
            "title": "Séjour",
            "panorama": "salle_200426.JPG",
            "hotSpots": [
                { "pitch": -5, "yaw": 120, "type": "scene", "text": "Cuisine", "sceneId": "cuisine" },
                { "pitch": -5, "yaw": -30, "type": "scene", "text": "Retour Entrée", "sceneId": "entree" }
            ]
        },
        "cuisine": {
            "title": "Cuisine",
            "panorama": "entree_cuisine_20042.JPG",
            "hotSpots": [
                { "pitch": -5, "yaw": 0, "type": "scene", "text": "Véranda", "sceneId": "veranda" },
                { "pitch": -5, "yaw": 180, "type": "scene", "text": "Retour Séjour", "sceneId": "sejour" }
            ]
        },
        "veranda": {
            "title": "Véranda",
            "panorama": "veranda_200426.JPG",
            "hotSpots": [
                { "pitch": -5, "yaw": 180, "type": "scene", "text": "Retour Cuisine", "sceneId": "cuisine" }
            ]
        },
        "chambre1": {
            "title": "Chambre 1",
            "panorama": "chambre_1.JPG",
            "hotSpots": [
                { "pitch": -5, "yaw": 90, "type": "scene", "text": "Chambre 2", "sceneId": "chambre2" },
                { "pitch": -5, "yaw": -90, "type": "scene", "text": "Retour Entrée", "sceneId": "entree" }
            ]
        },
        "chambre2": {
            "title": "Chambre 2",
            "panorama": "chambre_2_200426.jpg",
            "hotSpots": [
                { "pitch": -5, "yaw": 45, "type": "scene", "text": "SdB / WC", "sceneId": "sdb" },
                { "pitch": -5, "yaw": -135, "type": "scene", "text": "Retour Chambre 1", "sceneId": "chambre1" }
            ]
        },
        "sdb": {
            "title": "Salle de Bain / WC",
            "panorama": "sdb_200426.JPG",
            "hotSpots": [
                { "pitch": -10, "yaw": 0, "type": "scene", "text": "Retour Chambre 2", "sceneId": "chambre2" }
            ]
        }
    }
});

// Cache l'écran de chargement quand la première image est prête
viewer.on('load', function() {
    const loader = document.getElementById('loader-overlay');
    loader.style.opacity = '0';
    setTimeout(() => { loader.style.display = 'none'; }, 800);
});
</script>
</body>
</html>
