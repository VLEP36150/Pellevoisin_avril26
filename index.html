<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visite 9 Ave de la République - Pellevoisin</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css"/>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; font-family: sans-serif; background: #1a1a1a; }
        #panorama { width: 100%; height: calc(100% - 110px); }
        
        #controls {
            height: 110px; width: 100%; background: rgba(0, 0, 0, 0.95);
            display: flex; justify-content: flex-start; align-items: center;
            gap: 8px; overflow-x: auto; padding: 0 15px;
            scrollbar-width: thin;
        }

        .nav-btn {
            padding: 10px 15px; background: #333; color: white; border: 1px solid #555;
            border-radius: 6px; cursor: pointer; white-space: nowrap; font-size: 14px;
            transition: all 0.3s ease;
        }

        .nav-btn:hover { background: #555; border-color: #888; }
        .nav-btn.active { background: #007bff; border-color: #fff; font-weight: bold; }

        #loader-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #1a1a1a; color: white; display: flex; 
            flex-direction: column; align-items: center; justify-content: center; z-index: 2000;
        }
        h1 { font-size: 22px; text-align: center; margin-bottom: 5px; }
    </style>
</head>
<body>

<div id="loader-overlay">
    <h1>Pellevoisin 9 avenue de la République</h1>
    <p>Chargement de la visite virtuelle...</p>
</div>

<div id="panorama"></div>

<div id="controls">
    <div class="nav-btn active" onclick="loadScene('facade', this)">La Maison (Façade)</div>
    <div class="nav-btn" onclick="loadScene('entree', this)">Entrée</div>
    <div class="nav-btn" onclick="loadScene('sejour', this)">Séjour</div>
    <div class="nav-btn" onclick="loadScene('cuisine', this)">Cuisine</div>
    <div class="nav-btn" onclick="loadScene('veranda', this)">Véranda</div>
    <div class="nav-btn" onclick="loadScene('chambre1', this)">Chambre 1</div>
    <div class="nav-btn" onclick="loadScene('chambre2', this)">Chambre 2</div>
    <div class="nav-btn" onclick="loadScene('sdb', this)">SdB / WC</div>
    <div class="nav-btn" onclick="loadScene('chambre_etage', this)" style="background: #28a745;">Chambre Étage</div>
    <div class="nav-btn" onclick="loadScene('cave', this)">La Cave</div>
    <div class="nav-btn" onclick="loadScene('jardin', this)">Jardin Arrière</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>
<script>
const viewer = pannellum.viewer('panorama', {
    "default": {
        "firstScene": "facade",
        "autoLoad": true,
        "showControls": true,
        "orientationOnDeviceHelp": false
    },
    "scenes": {
        "facade": { 
            "title": "Façade", 
            "panorama": "facade_200426.JPG",
            "yaw": 180 
        },
        "entree": { "title": "Entrée", "panorama": "entree_200426.JPG" },
        "sejour": { "title": "Séjour", "panorama": "salle_200426.JPG" },
        "cuisine": { "title": "Cuisine", "panorama": "cuisine_200426.JPG" },
        "veranda": { "title": "Véranda", "panorama": "veranda_200426.JPG" },
        "chambre1": { "title": "Chambre 1", "panorama": "chambre_1.JPG" },
        "chambre2": { "title": "Chambre 2", "panorama": "chambre_2_200426.JPG" },
        "sdb": { "title": "SdB / WC", "panorama": "sdb_200426.JPG" },
        "chambre_etage": { "title": "Chambre Étage", "panorama": "chambre_etage.JPG" },
        "jardin": { "title": "Jardin Arrière", "panorama": "jardin_200426.JPG" }
    }
});

function loadScene(id, btn) {
    viewer.loadScene(id);
    document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
}

viewer.on('load', () => {
    document.getElementById('loader-overlay').style.display = 'none';
});
</script>
</body>
</html>
